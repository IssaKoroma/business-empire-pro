{background:#fff;color:#000;padding:12px;border-radius:8px}.subCard{background:#0f1d36;border:1px solid #1e3a5f;border-radius:10px;padding:8px;margin:6px 0;color:#e2e8f0}</style></head><body>

<script>/* small code same features - report like picture green headers */let fM='today';let sD=JSON.parse(localStorage.getItem('stock')||'[]');let saD=JSON.parse(localStorage.getItem('sales')||'[]');let exD=JSON.parse(localStorage.getItem('exp')||'[]');let cuD=JSON.parse(localStorage.getItem('cust')||'[]');let yoD=JSON.parse(localStorage.getItem('you')||'[]');let subs=JSON.parse(localStorage.getItem('subscribers')||'[]');let bN=localStorage.getItem('bizName')||'BUSINESS EMPIRE PRO';function fm(n){return 'Le '+Number(n||0).toLocaleString();}let isAdm=false;function isAdmin(p,c){return(p=='admin'||p=='072039084'||p=='072641385'||p=='072037074')&&(c=='Issa2024!'||c=='Issa2024'||c=='admin123');}function checkL(){let s=JSON.parse(localStorage.getItem('session')||'null');if(!s){loginOverlay.style.display='flex';isAdm=false;hideA();return;}if(isAdmin(s.phone,s.code)){loginOverlay.style.display='none';isAdm=true;showA();return;}let f=subs.find(x=>x.code==s.code&&x.phone==s.phone);if(!f){loginOverlay.style.display='flex';isAdm=false;hideA();return;}let t=new Date().toISOString().split('T')[0];if(f.expiry<t){alert('Expired '+f.expiry);loginOverlay.style.display='flex';isAdm=false;hideA();return;}loginOverlay.style.display='none';isAdm=false;hideA();}function showA(){document.getElementById('b-set').style.display='block';}function hideA(){document.getElementById('b-set').style.display='none';if(document.getElementById('tab-set').style.display=='block'){document.getElementById('tab-set').style.display='none';sh('dash');}}function doLogin(){let p=lp.value.trim();let c=lc.value.trim();if(!p||!c){alert('Enter phone code');return;}if(isAdmin(p,c)){localStorage.setItem('session',JSON.stringify({phone:p,code:c}));checkL();render();return;}let f=subs.find(s=>s.phone==p&&s.code==c);if(!f){alert('Wrong code! WhatsApp 072641385');return;}let t=new Date().toISOString().split('T')[0];if(f.expiry<t){alert('Expired '+f.expiry);return;}localStorage.setItem('session',JSON.stringify({phone:p,code:c}));checkL();render();}function logout(){localStorage.removeItem('session');location.reload();}function genC(){if(!isAdm){alert('Admin only');return;}let n=gn.value.trim();let p=gp.value.trim();let m=parseInt(gm.value)||1;if(!p){alert('Phone');return;}let code='EMP-'+Math.random().toString(36).substring(2,6).toUpperCase();let d=new Date();d.setDate(d.getDate()+(m*30));let exp=d.toISOString().split('T')[0];let tot=m*300;let e=subs.find(s=>s.phone==p);if(e){e.code=code;e.expiry=exp;e.months=m;e.total=tot;e.name=n;}else{subs.push({name:n,phone:p,code,expiry:exp,months:m,total:tot});}localStorage.setItem('subscribers',JSON.stringify(subs));gr.innerHTML=`Code:<b style="font-size:18px;color:#fff">${code}</b><br>Phone:${p}<br>${m}M Le${tot}<br>Exp:${exp}`;waL.href=`https://wa.me/${p.replace(/[^0-9]/g,'')}?text=`+encodeURIComponent(`CODE Phone:${p} Code:${code} ${m}M Le${tot} Exp:${exp} Orange:072039084`);waL.style.display='block';renderSub();}function renderSub(){let h='<tr><th>Name</th><th>Phone</th><th>Code</th><th>Exp</th><th>Del</th></tr>';subs.forEach((s,i)=>{h+=`<tr><td>${s.name||''}</td><td>${s.phone}</td><td><b>${s.code}</b></td><td>${s.expiry}</td><td><button onclick="delS(${i})" style="background:red;color:#fff;border:none;padding:2px 5px">X</button></td></tr>`;});subTable.innerHTML=h;}function delS(i){if(confirm('Delete?')){subs.splice(i,1);localStorage.setItem('subscribers',JSON.stringify(subs));renderSub();}}function sh(t){if(t=='set'&&!isAdm){alert('Admin only');return;}document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');document.getElementById('tab-'+t).style.display='block';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));let b=document.getElementById('b-'+t);if(b)b.classList.add('active');}function setF(m){fM=m;render();}function getD(){return gDate.value;}function filt(a){if(fM=='all')return a;let d=getD();return a.filter(x=>x.date==d||x.taken==d);}function saveB(){let v=bizIn.value.trim();if(!v)return;bN=v;localStorage.setItem('bizName',v);render();}function addStock(){let it=stItem.value.trim();let q=parseInt(stQty.value)||0;let c=parseInt(stCost.value)||0;let s=parseInt(stSell.value)||0;let d=stDate.value;if(!it||!q)return;let ex=sD.find(x=>x.item.toLowerCase()==it.toLowerCase());if(ex){ex.qty+=q;ex.left+=q;ex.cost=c||ex.cost;ex.sell=s||ex.sell;ex.date=d;}else{sD.push({item:it,qty:q,left:q,cost:c,sell:s,date:d});}localStorage.setItem('stock',JSON.stringify(sD));render();}function addSale(){let it=saItem.value.trim();let q=parseInt(saQty.value)||0;let p=parseInt(saPrice.value)||0;let d=saDate.value;if(!it||!q)return;let st=sD.find(x=>x.item.toLowerCase()==it.toLowerCase());let cost=st?st.cost:0;let sp=p||(st?st.sell:0);if(!sp)return;let ex=saD.find(x=>x.item.toLowerCase()==it.toLowerCase()&&x.date==d);if(ex){ex.qty+=q;ex.price=sp;ex.amt=ex.qty*sp;ex.profit=ex.qty*(sp-cost);}else{saD.push({item:it,qty:q,price:sp,amt:q*sp,profit:q*(sp-cost),date:d});}if(st){st.left-=q;if(st.left<0)st.left=0;}localStorage.setItem('sales',JSON.stringify(saD));localStorage.setItem('stock',JSON.stringify(sD));render();}function addExp(){let n=exName.value.trim();let a=parseInt(exAmt.value)||0;let d=exDate.value;if(!n||!a)return;exD.push({name:n,amt:a,date:d});localStorage.setItem('exp',JSON.stringify(exD));render();}function addCust(){let n=cuName.value.trim();let it=cuItem.value.trim();let t=parseInt(cuTotal.value)||0;let ph=cuPhone.value.trim();let tk=cuTaken.value;let pd=cuPayDate.value;if(!n||!t)return;cuD.push({name:n,item:it,total:t,paid:0,balance:t,phone:ph,taken:tk,payDate:pd,date:tk});localStorage.setItem('cust',JSON.stringify(cuD));render();}function addYou(){let n=yoName.value.trim();let it=yoItem.value.trim();let t=parseInt(yoTotal.value)||0;let d=yoDate.value;if(!n||!t)return;yoD.push({name:n,item:it,total:t,paid:0,balance:t,date:d});localStorage.setItem('you',JSON.stringify(yoD));render();}function payD(tp,i){let a=parseInt(prompt('Pay amount:'))||0;if(!a)return;if(tp=='cust'){cuD[i].paid+=a;cuD[i].balance=cuD[i].total-cuD[i].paid;if(cuD[i].balance<0)cuD[i].balance=0;localStorage.setItem('cust',JSON.stringify(cuD));}if(tp=='you'){yoD[i].paid+=a;yoD[i].balance=yoD[i].total-yoD[i].paid;if(yoD[i].balance<0)yoD[i].balance=0;localStorage.setItem('you',JSON.stringify(yoD));}render();}function render(){bizH.innerText=bN;bizIn.value=bN;let d=getD();gInfo.innerText='Date:'+d+' | '+fM;let fS=filt(sD);let fSa=filt(saD);let fEx=filt(exD);let fCu=filt(cuD);let fYo=filt(yoD);stockTable.innerHTML='<tr><th>Item</th><th>Qty</th><th>Left</th><th>Cost</th><th>Sell</th></tr>'+fS.map(s=>`<tr><td>${s.item}</td><td>${s.qty}</td><td>${s.left}</td><td>${fm(s.cost)}</td><td>${fm(s.sell)}</td></tr>`).join('');salesTable.innerHTML='<tr><th>Date</th><th>Item</th><th>Qty</th><th>Amt</th><th>Profit</th></tr>'+fSa.map(s=>`<tr><td>${s.date}</td><td>${s.item}</td><td>${s.qty}</td><td>${fm(s.amt)}</td><td>${fm(s.profit)}</td></tr>`).join('');expTable.innerHTML='<tr><th>Date</th><th>Exp</th><th>Amt</th></tr>'+fEx.map(s=>`<tr><td>${s.date}</td><td>${s.name}</td><td>${fm(s.amt)}</td></tr>`).join('');custTable.innerHTML='<tr><th>Name</th><th>Item</th><th>Bal</th><th>Phone</th><th>Act</th></tr>'+fCu.map(s=>{let ri=cuD.indexOf(s);return `<tr><td>${s.name}</td><td>${s.item}</td><td><b>${fm(s.balance)}</b></td><td>${s.phone||''}</td><td><button onclick="payD('cust',${ri})" style="background:#22c55e;border:none;padding:3px 6px;border-radius:4px">Pay</button></td></tr>`}).join('');youTable.innerHTML='<tr><th>Supplier</th><th>Item</th><th>Bal</th><th>Date</th></tr>'+fYo.map(s=>`<tr><td>${s.name}</td><td>${s.item}</td><td><b>${fm(s.balance)}</b></td><td>${s.date}</td></tr>`).join('');let sv=fS.reduce((a,b)=>a+b.left*b.sell,0);let sa=fSa.reduce((a,b)=>a+b.amt,0);let gp=fSa.reduce((a,b)=>a+b.profit,0);let ea=fEx.reduce((a,b)=>a+b.amt,0);let net=gp-ea;let cb=fCu.reduce((a,b)=>a+b.balance,0);let yb=fYo.reduce((a,b)=>a+b.balance,0);document.getElementById('d-stock').innerTe
