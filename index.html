<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BUSINESS - Empire Pro</title>
<style>
body{font-family:Arial;background:#e5e7eb;color:#111;padding:0;margin:0}
.top{background:linear-gradient(90deg,#1e293b,#1e3a8a);color:#fff;padding:16px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;font-size:19px;max-width:75%}.top small{font-size:11px;opacity:.8}
.cards{display:flex;gap:8px;padding:10px}
.c{background:#fff;border-radius:12px;padding:12px;flex:1;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.c small{font-size:11px;color:#64748b}.c b{font-size:15px}
.sales{color:#059669}.cost{color:#dc2626}
.owe{background:#fff;margin:0 10px;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tabs{display:flex;gap:8px;padding:10px}
.tab{flex:1;padding:13px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}
.tab.active{background:#1e293b;color:#fff}
.tab.inactive{background:#fff;color:#111;border:1px solid #ddd}
.content{background:#fff;margin:10px;border-radius:16px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input,select,button{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:14px;box-sizing:border-box}
.btn{background:#22c55e;border:none;font-weight:bold;color:#000}
.subtabs{display:flex;gap:8px;margin-bottom:8px}
.subtabs button{flex:1;padding:12px;border-radius:10px;border:1px solid #ddd;font-weight:bold}
.subtabs.on{background:#1e293b;color:#fff;border-color:#1e293b}
.subtabs.off{background:#fff;color:#111}
.lock{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.lockCard{background:#1e293b;color:#fff;padding:20px;border-radius:16px;width:100%;max-width:380px;text-align:center}
.gear{background:rgba(255,255,255,.2);border:none;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:10000;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.modalBox{background:#fff;padding:20px;border-radius:16px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.itemRow{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.creditItem{background:#fffef0;border-left:4px solid #f59e0b;padding:10px;border-radius:8px;margin:6px 0}
</style>
</head>
<body>

<div id="lockScreen" class="lock"><div class="lockCard">
<div id="stepCode"><h2>🔒 MY BUSINESS Locked</h2><p>Pay <b>Le 200/month</b></p><input id="codeInput" placeholder="BIZPRO-XXXX-YYYYMMDD"><button onclick="unlockWithCode()" class="btn">UNLOCK</button><p id="lockMsg" style="color:#f87171"></p></div>
<div id="stepCreatePass" style="display:none"><h2>🔑 Create Password</h2><input id="newPass" type="password" placeholder="New pass min 4"><input id="confirmPass" type="password" placeholder="Confirm"><button onclick="setPassword()" class="btn">Save & Enter</button></div>
<div id="stepLoginPass" style="display:none"><h2>🔑 Password</h2><input id="loginPass" type="password" placeholder="Your password"><button onclick="loginWithPass()" class="btn">Login</button><p id="loginMsg" style="color:#f87171"></p><span onclick="resetApp()" style="color:#94a3b8;text-decoration:underline;font-size:12px;cursor:pointer">Reset with new code</span></div>
</div></div>

<div class="top"><div><h2 id="bizNameDisplay">MY BUSINESS</h2><small>Empire Pro • Paid Edition • <span id="licSmall"></span></small></div><button class="gear" onclick="openSettings()">⚙️</button></div>

<div class="cards">
<div class="c"><small>SALES</small><br><b class="sales" id="salesView">Le 0</b></div>
<div class="c"><small>COST</small><br><b class="cost" id="costView">Le 0</b></div>
<div class="c"><small>PROFIT</small><br><b id="profitView">Le 0</b></div>
</div>

<div class="owe"><div><small>CUSTOMERS OWE YOU</small><br><b id="oweView">Le 0</b></div><div style="font-size:28px">📒</div></div>

<div class="tabs">
<button id="tabSalesCost" class="tab active" onclick="switchMain('salescost')">💰 SALES & COST</button>
<button id="tabCredit" class="tab inactive" onclick="switchMain('credit')">📒 CREDIT BOOK</button>
</div>

<div id="secSalesCost" class="content">
<div class="subtabs">
<button id="btnSales" class="off" onclick="setType('sales')">+ SALES</button>
<button id="btnCost" class="on" onclick="setType('cost')">- COST</button>
</div>
<select id="monthSel"><option>September 2026</option><option>October 2026</option><option>November 2026</option></select>
<input id="itemName" placeholder="e.g. Sold 10 bags rice">
<input id="itemAmount" type="number" placeholder="Amount Le e.g. 600">
<input id="typeSel" type="hidden" value="cost">
<button onclick="addSale()" class="btn">Add Transaction</button>
<div id="transactions"></div>
</div>

<div id="secCredit" class="content" style="display:none">
<input id="creditName" placeholder="Customer name">
<input id="creditAmount" type="number" placeholder="Amount owe Le">
<input id="creditPhone" placeholder="Phone">
<button onclick="addCredit()" class="btn" style="background:#f59e0b">+ Add Credit</button>
<div id="creditList"></div>
</div>

<!-- SETTINGS WITH BUSINESS NAME CHANGE -->
<div id="settingsModal" class="modal"><div class="modalBox">
<h3>⚙️ Settings</h3>
<p style="font-size:11px" id="licFull"></p><hr>

<h4>🏪 Business Name</h4>
<input id="bizNameInput" placeholder="e.g. Issa Phone Shop">
<button onclick="saveBizName()" class="btn" style="background:#3b82f6;color:#fff">💾 Save Business Name</button>

<hr>
<h4>🔑 Change Password</h4>
<input id="oldPass" type="password" placeholder="Old password">
<input id="newPass2" type="password" placeholder="New password min 4">
<button onclick="changePassword()" class="btn">Update Password</button>

<button onclick="logout()" style="background:#ef4444;color:#fff;margin-top:12px">Logout</button>
<button onclick="document.getElementById('settingsModal').style.display='none'" style="background:#e5e7eb">Close</button>
</div></div>

<script>
let currentType='cost';
function switchMain(t){
 document.getElementById('secSalesCost').style.display=t==='salescost'?'block':'none';
 document.getElementById('secCredit').style.display=t==='credit'?'block':'none';
 document.getElementById('tabSalesCost').className=t==='salescost'?'tab active':'tab inactive';
 document.getElementById('tabCredit').className=t==='credit'?'tab active':'tab inactive';
}
function setType(type){
 currentType=type;
 document.getElementById('typeSel').value=type;
 document.getElementById('btnSales').className=type==='sales'?'on':'off';
 document.getElementById('btnCost').className=type==='cost'?'on':'off';
}
function openSettings(){
 document.getElementById('bizNameInput').value=localStorage.getItem('bizpro_bizName')||'MY BUSINESS';
 document.getElementById('settingsModal').style.display='flex';
}
function saveBizName(){
 let n=document.getElementById('bizNameInput').value.trim();
 if(!n){alert("Enter business name");return;}
 localStorage.setItem('bizpro_bizName',n);
 document.getElementById('bizNameDisplay').innerText=n.toUpperCase();
 document.title=n+" - Empire Pro";
 alert("✅ Business name saved: "+n);
 document.getElementById('settingsModal').style.display='none';
}
function show(id){document.getElementById('lockScreen').style.display='flex';['stepCode','stepCreatePass','stepLoginPass'].forEach(s=>document.getElementById(s).style.display='none');document.getElementById(id).style.display='block';}
function hideLock(){document.getElementById('lockScreen').style.display='none';}
function init(){
 const savedName=localStorage.getItem('bizpro_bizName');
 if(savedName){document.getElementById('bizNameDisplay').innerText=savedName.toUpperCase(); document.title=savedName+" - Empire Pro";}
 const code=localStorage.getItem('bizpro_license'),exp=localStorage.getItem('bizpro_expiry'),pass=localStorage.getItem('bizpro_userPass'),logged=sessionStorage.getItem('bizpro_logged');
 if(!code||!exp){show('stepCode');return;}
 if(new Date()>new Date(exp)){alert("Expired! Pay again");localStorage.clear();sessionStorage.clear();show('stepCode');return;}
 document.getElementById('licSmall').innerText=code; document.getElementById('licFull').innerText=code+" | Exp:"+new Date(exp).toLocaleDateString();
 if(!pass){show('stepCreatePass');return;}
 if(logged==='yes') hideLock(); else show('stepLoginPass');
}
function unlockWithCode(){
 let e=document.getElementById('codeInput').value.trim().toUpperCase();
 try{let p=e.split('-'); if(p.length<3||p[0]!='BIZPRO') throw "bad"; let d=p[p.length-1]; if(d.length!=8) throw "bad"; let ex=new Date(d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8)); if(isNaN(ex)) throw "bad"; if(new Date()>ex){document.getElementById('lockMsg').innerText="Expired code";return;} localStorage.setItem('bizpro_license',e); localStorage.setItem('bizpro_expiry',ex.toISOString()); document.getElementById('licSmall').innerText=e; document.getElementById('licFull').innerText=e+" | Exp:"+ex.toLocaleDateString(); if(!localStorage.getItem('bizpro_userPass')) show('stepCreatePass'); else {sessionStorage.setItem('bizpro_logged','yes'); hideLock();}}catch(err){document.getElementById('lockMsg').innerText="❌ Wrong code!";}
}
function setPassword(){let a=document.getElementById('newPass').value,b=document.getElementById('confirmPass').value; if(a.length<4){alert("Min 4");return;} if(a!==b){alert("No match");return;} localStorage.setItem('bizpro_userPass',a); sessionStorage.setItem('bizpro_logged','yes'); hideLock();}
function loginWithPass(){if(document.getElementById('loginPass').value===localStorage.getItem('bizpro_userPass')){sessionStorage.setItem('bizpro_logged','yes'); hideLock();} else document.getElementById('loginMsg').innerText="Wrong password";}
function changePassword(){let o=document.getElementById('oldPass').value,n=document.getElementById('newPass2').value; if(o!==localStorage.getItem('bizpro_userPass')){alert("Old wrong");return;} if(n.length<4){alert("Min 4");return;} localStorage.setItem('bizpro_userPass',n); alert("✅ Changed!"); document.getElementById('settingsModal').style.display='none';}
function resetApp(){if(confirm("Reset? Need new monthly code")){localStorage.clear();sessionStorage.clear();location.reload();}}
function logout(){sessionStorage.removeItem('bizpro_logged');location.reload();}

let data=JSON.parse(localStorage.getItem('mybiz_data')||'[]');
let credits=JSON.parse(localStorage.getItem('mybiz_credit')||'[]');
if(data.length===0){data=[{name:"Sold 10 bags rice",amount:1800,type:"sales"},{name:"Bought rice",amount:1200,type:"cost"}];}
function render(){
 let sales=0,cost=0,html="";
 data.forEach((s,i)=>{if(s.type==='sales') sales+=s.amount; else cost+=s.amount; html+=`<div class="itemRow">${s.name} - Le ${s.amount} (${s.type}) <span onclick="delSale(${i})" style="color:red;font-weight:bold;cursor:pointer">X</span></div>`;});
 document.getElementById('salesView').innerText="Le "+sales; document.getElementById('costView').innerText="Le "+cost; document.getElementById('profitView').innerText="Le "+(sales-cost);
 document.getElementById('transactions').innerHTML=html; localStorage.setItem('mybiz_data',JSON.stringify(data));
 let owe=0,ch=""; credits.forEach((c,i)=>{owe+=c.amount; ch+=`<div class="creditItem"><b>${c.name}</b> - Le ${c.amount}<br><small>${c.phone||''}</small><div><button onclick="payCredit(${i})" style="width:auto;padding:6px;background:#22c55e">Paid</button> <button onclick="delCredit(${i})" style="width:auto;padding:6px;background:#ef4444;color:#fff">X</button></div></div>`;});
 document.getElementById('oweView').innerText="Le "+owe; document.getElementById('creditList').innerHTML=ch||"<p style='font-size:12px;color:#888'>No credit yet</p>"; localStorage.setItem('mybiz_credit',JSON.stringify(credits));
}
function addSale(){let n=document.getElementById('itemName').value,a=parseFloat(document.getElementById('itemAmount').value),t=document.getElementById('typeSel').value; if(!n||!a){alert("Enter name & amount");return;} data.push({name:n,amount:a,type:t}); document.getElementById('itemName').value=""; document.getElementById('itemAmount').value=""; render();}
function delSale(i){data.splice(i,1); render();}
function addCredit(){let n=document.getElementById('creditName').value,a=parseFloat(document.getElementById('creditAmount').value),p=document.getElementById('creditPhone').value; if(!n||!a){alert("Enter");return;} credits.push({name:n,amount:a,phone:p}); document.getElementById('creditName').value=""; document.getElementById('creditAmount').value=""; document.getElementById('creditPhone').value=""; render();}
function delCredit(i){credits.splice(i,1); render();}
function payCredit(i){let c=credits[i]; data.push({name:`Received from ${c.name}`,amount:c.amount,type:'sales'}); credits.splice(i,1); render(); alert("✅ Paid!");}
init(); render();
</script>
</body>
</html>
