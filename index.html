<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Empire</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);margin:0;padding:10px;min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:18px;text-align:center;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.2);font-weight:bold;font-size:19px}
.header small{opacity:.9;font-size:13px;font-weight:400}
.globalBox{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:5px solid #16a34a}
.globalBox input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:8px 0;font-size:15px}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.todayBtn{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 3px 6px rgba(22,163,74,.3)}
.allBtn{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 3px 6px rgba(37,99,235,.3)}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}
.tabs button{padding:10px 14px;border:none;border-radius:10px;background:#fff;cursor:pointer;white-space:nowrap;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1);color:#334155}
.tabs button.active{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
input{width:100%;padding:12px;margin:6px 0;border:2px solid #e2e8f0;border-radius:10px;font-size:15px}
.addBtn{width:100%;padding:14px;border:none;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer;margin-top:8px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.stockBtn{background:linear-gradient(135deg,#16a34a,#15803d)}.saleBtn{background:linear-gradient(135deg,#0891b2,#06b6d4)}.expBtn{background:linear-gradient(135deg,#ef4444,#dc2626)}.custBtn{background:linear-gradient(135deg,#ec4899,#db2777)}.supBtn{background:linear-gradient(135deg,#f59e0b,#d97706)}.setBtn{background:linear-gradient(135deg,#0f172a,#334155)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;border-radius:10px;overflow:hidden}
th,td{border:1px solid #e2e8f0;padding:8px;text-align:left}
th{background:#f1f5f9}
.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:16px;border-radius:14px;font-weight:bold;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.t1{background:linear-gradient(135deg,#86efac,#22c55e)}.t2{background:linear-gradient(135deg,#7dd3fc,#0ea5e9)}.t3{background:linear-gradient(135deg,#c4b5fd,#8b5cf6);color:#fff}.t4{background:linear-gradient(135deg,#fda4af,#f43f5e);color:#fff}.t5{background:linear-gradient(135deg,#fde68a,#facc15)}.t6{background:linear-gradient(135deg,#fed7aa,#fb923c)}
.reportPaper{background:#fff;color:#000;padding:12px;border-radius:12px;border:1px solid #e2e8f0}
@media print{.noPrint{display:none!important}}
</style>
</head>
<body>
<div class="header noPrint"><span id="bizHeader"></span><br><small id="globalInfo"></small></div>
<div class="globalBox noPrint">
<label>📅 SELECT DATE</label>
<input type="date" id="globalDate" value="2026-10-02">
<div class="btns">
<button class="todayBtn" onclick="setFilter('today')">Today Data Only</button>
<button class="allBtn" onclick="setFilter('all')">Show ALL Dates</button>
</div>
</div>
<div class="tabs noPrint">
<button id="b-dash" class="active" onclick="showTab('dash')">Dash</button>
<button id="b-stock" onclick="showTab('stock')">Stock</button>
<button id="b-sales" onclick="showTab('sales')">Sales</button>
<button id="b-exp" onclick="showTab('exp')">Exp</button>
<button id="b-cust" onclick="showTab('cust')">Cust</button>
<button id="b-you" onclick="showTab('you')">You Owe</button>
<button id="b-report" onclick="showTab('report')">Report</button>
<button id="b-set" onclick="showTab('set')">⚙️ Set</button>
</div>

<div id="tab-dash" class="card noPrint">
<div class="dashGrid">
<div class="tile t1">Stock Left Value<br><span id="d-stock">Le0</span></div>
<div class="tile t2">Sales<br><span id="d-sales">Le0</span></div>
<div class="tile t3">Gross Profit<br><span id="d-gross">Le0</span></div>
<div class="tile t4">Net Profit<br><span id="d-net">Le0</span></div>
<div class="tile t5">Cust Owe Balance<br><span id="d-cust">Le0</span></div>
<div class="tile t6">You Owe Balance<br><span id="d-you">Le0</span></div>
</div>
</div>

<div id="tab-stock" class="card noPrint" style="display:none">
<h3>Stock</h3>
<input id="stItem" placeholder="Item e.g Rice">
<input id="stQty" type="number" placeholder="Qty">
<input id="stCost" type="number" placeholder="Cost per 1">
<input id="stSell" type="number" placeholder="Sell per 1">
<input id="stDate" type="date" value="2026-10-02">
<button class="addBtn stockBtn" onclick="addStock()">Add Stock</button>
<div style="overflow:auto"><table id="stockTable"></table></div>
</div>

<div id="tab-sales" class="card noPrint" style="display:none">
<h3>Sales</h3>
<input id="saleItem" placeholder="Item e.g Rice">
<input id="saleQty" type="number" placeholder="Qty">
<input id="salePrice" type="number" placeholder="Sell Price per 1">
<input id="saleDate" type="date" value="2026-10-02">
<button class="addBtn saleBtn" onclick="addSale()">Sell</button>
<div style="overflow:auto"><table id="salesTable"></table></div>
</div>

<div id="tab-exp" class="card noPrint" style="display:none">
<h3>Expenses</h3>
<input id="expName" placeholder="Expense e.g Transport">
<input id="expAmt" type="number" placeholder="Amount">
<input id="expDate" type="date" value="2026-10-02">
<button class="addBtn expBtn" onclick="addExp()">Add Expense</button>
<div style="overflow:auto"><table id="expTable"></table></div>
</div>

<div id="tab-cust" class="card noPrint" style="display:none">
<h3>Customer Debt</h3>
<input id="custName" placeholder="Name">
<input id="custItem" placeholder="Item">
<input id="custTotal" type="number" placeholder="Total Owe Amt e.g 2000">
<input id="custPhone" placeholder="Phone">
<input id="custTaken" type="date" value="2026-10-02">
<input id="custPayDate" type="date" value="2026-10-30">
<button class="addBtn custBtn" onclick="addCust()">Add Customer Debt</button>
<div style="overflow:auto"><table id="custTable"></table></div>
</div>

<div id="tab-you" class="card noPrint" style="display:none">
<h3>You Owe Supplier</h3>
<input id="youName" placeholder="Supplier Name">
<input id="youItem" placeholder="Item">
<input id="youTotal" type="number" placeholder="Total Owe Amt e.g 3000">
<input id="youDate" type="date" value="2026-10-02">
<button class="addBtn supBtn" onclick="addYou()">Add Supplier Credit</button>
<div style="overflow:auto"><table id="youTable"></table></div>
</div>

<div id="tab-report" class="card">
<div class="noPrint" style="display:flex;gap:8px;margin-bottom:10px">
<button class="todayBtn" style="flex:1;padding:12px;border:none;border-radius:10px" onclick="makeReport('today')">That Day Report</button>
<button class="allBtn" style="flex:1;padding:12px;border:none;border-radius:10px" onclick="makeReport('all')">All Days Report</button>
</div>
<button class="noPrint" style="width:100%;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:10px;margin-bottom:10px" onclick="window.print()">🖨️ Print</button>
<div id="reportArea" class="reportPaper">Click Report Button</div>
</div>

<div id="tab-set" class="card noPrint" style="display:none">
<h3>⚙️ Business Settings</h3>
<input id="bizNameInput" placeholder="Type Your Business Name">
<button class="addBtn setBtn" onclick="saveBiz()">Save Business Name</button>
</div>

<script>
let filterMode='today';
let stockData=JSON.parse(localStorage.getItem('stock')||'[]');
let salesData=JSON.parse(localStorage.getItem('sales')||'[]');
let expData=JSON.parse(localStorage.getItem('exp')||'[]');
let custData=JSON.parse(localStorage.getItem('cust')||'[]');
let youData=JSON.parse(localStorage.getItem('you')||'[]');
let bizName=localStorage.getItem('bizName')||'GENERAL TRADING COMPANY (SL) LTD';

// MONEY FORMAT Le2,000
function fm(n){return 'Le'+Number(n||0).toLocaleString('en-US');}

function showTab(t){document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');document.getElementById('tab-'+t).style.display='block';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));let b=document.getElementById('b-'+t);if(b)b.classList.add('active');}
function setFilter(m){filterMode=m;renderAll();}
function getFDate(){return document.getElementById('globalDate').value;}
function filterByDate(arr){if(filterMode==='all')return arr;let d=getFDate();return arr.filter(x=>x.date===d||x.taken===d);}
function saveBiz(){let v=document.getElementById('bizNameInput').value.trim();if(!v){alert('Type name');return;}bizName=v;localStorage.setItem('bizName',v);document.getElementById('bizHeader').innerText=v;alert('Saved: '+v);}
function addStock(){let item=document.getElementById('stItem').value.trim();let qty=parseInt(document.getElementById('stQty').value)||0;let cost=parseInt(document.getElementById('stCost').value)||0;let sell=parseInt(document.getElementById('stSell').value)||0;let date=document.getElementById('stDate').value;if(!item||!qty){alert('Enter item & qty');return;}let ex=stockData.find(s=>s.item.toLowerCase()===item.toLowerCase());if(ex){ex.qty+=qty;ex.left+=qty;ex.cost=cost||ex.cost;ex.sell=sell||ex.sell;ex.date=date;}else{stockData.push({item,qty,left:qty,cost,sell,date});}localStorage.setItem('stock',JSON.stringify(stockData));renderAll();}
function addSale(){let item=document.getElementById('saleItem').value.trim();let qty=parseInt(document.getElementById('saleQty').value)||0;let price=parseInt(document.getElementById('salePrice').value)||0;let date=document.getElementById('saleDate').value;if(!item||!qty){alert('Enter item & qty');return;}let stock=stockData.find(s=>s.item.toLowerCase()===item.toLowerCase());let cost=stock?stock.cost:0;let sellPrice=price||(stock?stock.sell:0);if(!sellPrice){alert('Enter sell price');return;}let exist=salesData.find(s=>s.item.toLowerCase()===item.toLowerCase()&&s.date===date);if(exist){exist.qty+=qty;exist.price=sellPrice;exist.amt=exist.qty*sellPrice;exist.profit=exist.qty*(sellPrice-cost);}else{salesData.push({item,qty,price:sellPrice,amt:qty*sellPrice,profit:qty*(sellPrice-cost),date});}if(stock){stock.left-=qty;if(stock.left<0)stock.left=0;}localStorage.setItem('sales',JSON.stringify(salesData));localStorage.setItem('stock',JSON.stringify(stockData));renderAll();}
function addExp(){let name=document.getElementById('expName').value.trim();let amt=parseInt(document.getElementById('expAmt').value)||0;let date=document.getElementById('expDate').value;if(!name||!amt)return;expData.push({name,amt,date});localStorage.setItem('exp',JSON.stringify(expData));renderAll();}
function addCust(){let name=document.getElementById('custName').value.trim();let item=document.getElementById('custItem').value.trim();let total=parseInt(document.getElementById('custTotal').value)||0;let phone=document.getElementById('custPhone').value.trim();let taken=document.getElementById('custTaken').value;let payDate=document.getElementById('custPayDate').value;if(!name||!total)return;custData.push({name,item,total,paid:0,balance:total,phone,taken,payDate,date:taken});localStorage.setItem('cust',JSON.stringify(custData));renderAll();}
function addYou(){let name=document.getElementById('youName').value.trim();let item=document.getElementById('youItem').value.trim();let total=parseInt(document.getElementById('youTotal').value)||0;let date=document.getElementById('youDate').value;if(!name||!total)return;youData.push({name,item,total,paid:0,balance:total,date});localStorage.setItem('you',JSON.stringify(youData));renderAll();}
function del(a,i){if(a==='stock'){stockData.splice(i,1);localStorage.setItem('stock',JSON.stringify(stockData));}if(a==='sales'){salesData.splice(i,1);localStorage.setItem('sales',JSON.stringify(salesData));}if(a==='exp'){expData.splice(i,1);localStorage.setItem('exp',JSON.stringify(expData));}if(a==='cust'){custData.splice(i,1);localStorage.setItem('cust',JSON.stringify(custData));}if(a==='you'){youData.splice(i,1);localStorage.setItem('you',JSON.stringify(youData));}renderAll();}
function payDebt(type,i){let amt=parseInt(prompt('Enter pay amount:'))||0;if(!amt)return;if(type==='cust'){let r=custData[i];r.paid+=amt;r.balance=r.total-r.paid;if(r.balance<0)r.balance=0;localStorage.setItem('cust',JSON.stringify(custData));}if(type==='you'){let r=youData[i];r.paid+=amt;r.balance=r.total-r.paid;if(r.balance<0)r.balance=0;localStorage.setItem('you',JSON.stringify(youData));}renderAll();}
function renderAll(){
document.getElementById('bizHeader').innerText=bizName;
document.getElementById('bizNameInput').value=bizName;
let d=getFDate();document.getElementById('globalInfo').innerText='Date: '+d+' | Mode: '+filterMode;
let fStock=filterByDate(stockData);let fSales=filterByDate(salesData);let fExp=filterByDate(expData);let fCust=filterByDate(custData);let fYou=filterByDate(youData);

let stH='<tr><th>Item</th><th>Qty</th><th>Left</th><th>Cost</th><th>Sell</th><th>Date</th><th>X</th></tr>';
fStock.forEach(s=>{let ri=stockData.indexOf(s);stH+=`<tr><td>${s.item}</td><td>${s.qty}</td><td>${s.left}</td><td>${fm(s.cost)}</td><td>${fm(s.sell)}</td><td>${s.date}</td><td><button onclick="del('stock',${ri})">X</button></td></tr>`;});
document.getElementById('stockTable').innerHTML=stH;

let saH='<tr><th>Date</th><th>Item</th><th>Qty</th><th>Price</th><th>Amt</th><th>Profit</th><th>X</th></tr>';
fSales.forEach(s=>{let ri=salesData.indexOf(s);saH+=`<tr><td>${s.date}</td><td>${s.item}</td><td>${s.qty}</td><td>${fm(s.price)}</td><td>${fm(s.amt)}</td><td>${fm(s.profit)}</td><td><button onclick="del('sales',${ri})">X</button></td></tr>`;});
document.getElementById('salesTable').innerHTML=saH;

let exH='<tr><th>Date</th><th>Expense</th><th>Amt</th><th>X</th></tr>';
fExp.forEach(s=>{let ri=expData.indexOf(s);exH+=`<tr><td>${s.date}</td><td>${s.name}</td><td>${fm(s.amt)}</td><td><button onclick="del('exp',${ri})">X</button></td></tr>`;});
document.getElementById('expTable').innerHTML=exH;

let cuH='<tr><th>Name</th><th>Total</th><th>Paid</th><th>Balance</th><th>Act</th></tr>';
fCust.forEach(s=>{let ri=custData.indexOf(s);cuH+=`<tr><td>${s.name}<br><small>${s.item}</small></td><td>${fm(s.total)}</td><td>${fm(s.paid)}</td><td><b>${fm(s.balance)}</b></td><td><button onclick="payDebt('cust',${ri})">Pay</button><button onclick="del('cust',${ri})">X</button></td></tr>`;});
document.getElementById('custTable').innerHTML=cuH;

let yoH='<tr><th>Supplier</th><th>Total</th><th>Paid</th><th>Balance</th><th>Act</th></tr>';
fYou.forEach(s=>{let ri=youData.indexOf(s);yoH+=`<tr><td>${s.name}<br><small>${s.item}</small></td><td>${fm(s.total)}</td><td>${fm(s.paid)}</td><td><b>${fm(s.balance)}</b></td><td><button onclick="payDebt('you',${ri})">Pay</button><button onclick="del('you',${ri})">X</button></td></tr>`;});
document.getElementById('youTable').innerHTML=yoH;

let stockVal=fStock.reduce((a,b)=>a+b.left*b.sell,0);let salesAmt=fSales.reduce((a,b)=>a+b.amt,0);let gross=fSales.reduce((a,b)=>a+b.profit,0);let expAmt=fExp.reduce((a,b)=>a+b.amt,0);let net=gross-expAmt;let custBal=fCust.reduce((a,b)=>a+b.balance,0);let youBal=fYou.reduce((a,b)=>a+b.balance,0);
document.getElementById('d-stock').innerText=fm(stockVal);document.getElementById('d-sales').innerText=fm(salesAmt);document.getElementById('d-gross').innerText=fm(gross);document.getElementById('d-net').innerText=fm(net);document.getElementById('d-cust').innerText=fm(custBal);document.getElementById('d-you').innerText=fm(youBal);
}
function makeReport(mode){
let d=getFDate();
let fStock=mode==='today'?stockData.filter(x=>x.date===d):stockData;
let fSales=mode==='today'?salesData.filter(x=>x.date===d):salesData;
let fExp=mode==='today'?expData.filter(x=>x.date===d):expData;
let fCust=mode==='today'?custData.filter(x=>x.date===d||x.taken===d):custData;
let fYou=mode==='today'?youData.filter(x=>x.date===d):youData;
let stockVal=fStock.reduce((a,b)=>a+b.left*b.sell,0);let stockCost=fStock.reduce((a,b)=>a+b.qty*b.cost,0);let salesAmt=fSales.reduce((a,b)=>a+b.amt,0);let gross=fSales.reduce((a,b)=>a+b.profit,0);let expAmt=fExp.reduce((a,b)=>a+b.amt,0);let net=gross-expAmt;let custBal=fCust.reduce((a,b)=>a+b.balance,0);let youBal=fYou.reduce((a,b)=>a+b.balance,0);
let html=`<h2 style="text-align:center;border-bottom:2px solid #000">FULL BUSINESS REPORT</h2><div>Business: <b>${bizName}</b> | Date: ${mode==='today'?d:'ALL DATES'} | Printed: ${new Date().toLocaleString()}</div><div style="border:2px solid #000;padding:8px;margin:8px 0"><b>SUMMARY</b><br>Stock Cost: ${fm(stockCost)}<br>Stock Sell Value: ${fm(stockVal)}<br>Sales: ${fm(salesAmt)}<br>Cust Debt Bal: ${fm(custBal)}<br>You Owe Bal: ${fm(youBal)}<br>Expenses: ${fm(expAmt)}<br>Gross: ${fm(gross)}<br><b>NET: ${fm(net)}</b></div><h3>1. STOCK</h3><table><tr><th>Item</th><th>Qty</th><th>Left</th><th>Cost</th><th>Sell</th></tr>${fStock.map(s=>`<tr><td>${s.item}</td><td>${s.qty}</td><td>${s.left}</td><td>${fm(s.cost)}</td><td>${fm(s.sell)}</td></tr>`).join('')}</table><h3>2. SALES</h3><table><tr><th>Date</th><th>Item</th><th>Qty</th><th>Price</th><th>Amt</th><th>Profit</th></tr>${fSales.map(s=>`<tr><td>${s.date}</td><td>${s.item}</td><td>${s.qty}</td><td>${fm(s.price)}</td><td>${fm(s.amt)}</td><td>${fm(s.profit)}</td></tr>`).join('')}</table><h3>3. CUSTOMER DEBT</h3><table><tr><th>Name</th><th>Total</th><th>Paid</th><th>Balance</th></tr>${fCust.map(s=>`<tr><td>${s.name}</td><td>${fm(s.total)}</td><td>${fm(s.paid)}</td><td>${fm(s.balance)}</td></tr>`).join('')}</table><h3>4. YOU OWE</h3><table><tr><th>Supplier</th><th>Total</th><th>Paid</th><th>Balance</th></tr>${fYou.map(s=>`<tr><td>${s.name}</td><td>${fm(s.total)}</td><td>${fm(s.paid)}</td><td>${fm(s.balance)}</td></tr>`).join('')}</table><h3>5. EXPENSES</h3><table><tr><th>Date</th><th>Expense</th><th>Amt</th></tr>${fExp.map(s=>`<tr><td>${s.date}</td><td>${s.name}</td><td>${fm(s.amt)}</td></tr>`).join('')}</table>`;
document.getElementById('reportArea').innerHTML=html;
}
document.getElementById('globalDate').addEventListener('change',()=>renderAll());renderAll();
</script>
</body>
</html>
